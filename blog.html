<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | FlowAgent</title>
  <meta name="description" content="Read FlowAgent insights on AI automation, AI agents, social media automation, AI video marketing, and business productivity.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/flowagent-logo.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/site-theme.css">
</head>
<body data-page="blog">
  <div class="page-shell">
    <header class="site-header" id="siteHeader"></header>
    <main>
      <section class="section" id="blogIntro"></section>
      <section class="section">
        <div class="glass-card dashboard-panel">
          <div class="panel-heading-spread">
            <div>
              <p class="eyebrow">Search</p>
              <h3>Find content by topic</h3>
            </div>
          </div>
          <input id="blogSearch" type="search" placeholder="Search blog posts by keyword, category, or tag">
        </div>
      </section>
      <section class="section">
        <div class="package-grid" id="blogGrid"></div>
      </section>
    </main>
    <footer id="siteFooter"></footer>
  </div>
  <script src="/script.js"></script>
</body>
</html>
