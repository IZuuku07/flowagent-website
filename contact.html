<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | FlowAgent</title>
  <meta name="description" content="Contact FlowAgent to request a quote, consultation, AI build, chatbot setup, automation project, or AI video service.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/flowagent-logo.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="contact">
  <div class="page-shell">
    <header class="site-header" id="siteHeader"></header>
    <main>
      <section class="section" id="contactIntro"></section>
      <section class="section">
        <div class="order-layout">
          <form class="order-form glass-card" id="contactForm"></form>
          <aside class="contact-card">
            <div class="glass-card panel-stack" id="contactDetailsCard"></div>
            <div class="glass-card accent-card panel-stack">
              <p class="accent-label">Consultation</p>
              <h3>Prefer a strategy-first conversation?</h3>
              <p>Request a consultation and we’ll help you identify the highest-leverage AI opportunities first.</p>
              <a class="button button-small" href="/pricing">See Pricing</a>
            </div>
          </aside>
        </div>
      </section>
    </main>
    <footer id="siteFooter"></footer>
  </div>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="/script.js"></script>
</body>
</html>
