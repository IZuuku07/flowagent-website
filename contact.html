<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Contact FlowAgent to request a quote, consultation, AI build, chatbot setup, automation project, or AI video service.">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="contact">
  <div class="page-shell">
    <header class="site-header" id="siteHeader"></header>
    <main>
      <section class="section" id="contactIntro"></section>
      <section class="section">
        <div class="order-layout">
          <form class="order-form glass-card" id="contactForm"></form>
          <aside class="contact-card">
            <div class="glass-card panel-stack" id="contactDetailsCard"></div>
            <div class="glass-card panel-stack"><p class="eyebrow">WHAT HAPPENS NEXT</p><h3>A conversation about your workflow.</h3><p>We review your request and follow up to discuss the tools, scope, and next steps. If you would like a call, include your timezone and preferred times in your message.</p><p>Submitting this form requests a reply; it does not reserve a calendar slot.</p></div>
          </aside>
        </div>
      </section>
    </main>
    <footer id="siteFooter"></footer>
  </div>
  <script src="/script.js"></script>
